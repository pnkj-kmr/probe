paths:
  /api/:
    get:
      description: Responds with pong
      produces:
      - application/json
      responses:
        "200":
          description: pong
          schema:
            type: string
      summary: Ping
      tags:
      - Health
  /api/poll/{type}/{pollPeriod}:
    delete:
      consumes:
      - application/json
      description: deleting the poll config records
      parameters:
      - description: 'type: icmp / snmp'
        in: path
        name: type
        required: true
        type: string
      - description: 'Poll Period - like: 60/300'
        in: path
        name: pollPeriod
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: record
          schema:
            type: string
      summary: Delete All Poll Config
      tags:
      - Poll
    get:
      consumes:
      - application/json
      description: get totel record of poll config
      parameters:
      - description: 'type: icmp / snmp'
        in: path
        name: type
        required: true
        type: string
      - description: 'Poll Period - like: 60/300'
        in: path
        name: pollPeriod
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: record
          schema:
            type: string
      summary: Poll Config Total Count
      tags:
      - Poll
  /api/poll/{type}/{pollPeriod}/{id}:
    delete:
      consumes:
      - application/json
      description: delete poll config
      parameters:
      - description: 'type: icmp / snmp'
        in: path
        name: type
        required: true
        type: string
      - description: 'Poll Period - like: 60/300'
        in: path
        name: pollPeriod
        required: true
        type: string
      - description: CI ID of resource
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: record
          schema:
            type: string
      summary: Poll Config Delete
      tags:
      - Poll
    get:
      consumes:
      - application/json
      description: get poll config data
      parameters:
      - description: 'type: icmp / snmp'
        in: path
        name: type
        required: true
        type: string
      - description: 'Poll Period - like: 60/300'
        in: path
        name: pollPeriod
        required: true
        type: string
      - description: CI ID of resource
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: poll config
          schema:
            type: string
      summary: Poll Config Get View
      tags:
      - Poll
  /api/poll/icmp:
    post:
      consumes:
      - application/json
      description: APIs helps to write poll parameter into db
      parameters:
      - description: ICMP Request body
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/M.ICMPReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/M.ICMPReq'
      summary: Polling Status update
      tags:
      - Poll
  /api/poll/snmp:
    post:
      consumes:
      - application/json
      description: APIs helps to write poll parameter into db
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/M.SNMPReq'
      summary: Polling Status update
      tags:
      - Poll
  /api/profile/{credential_type}/:
    delete:
      consumes:
      - application/json
      description: delete all
      parameters:
      - description: 'type: snmp / ssh / telnet / sftp / http'
        in: path
        name: credential_type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: record
          schema:
            type: string
      summary: Delete all credentials for profile
      tags:
      - Credential
    get:
      consumes:
      - application/json
      description: total count
      parameters:
      - description: 'type: snmp / ssh / telnet / sftp / http'
        in: path
        name: credential_type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: record
          schema:
            type: string
      summary: Total records of credential
      tags:
      - Credential
  /api/profile/{credential_type}/{id}:
    delete:
      consumes:
      - application/json
      description: delete one
      parameters:
      - description: 'type: snmp / ssh / telnet / sftp / http'
        in: path
        name: credential_type
        required: true
        type: string
      - description: credential id (login/device profile id)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: record
          schema:
            type: string
      summary: Delete credential for profile id
      tags:
      - Credential
    get:
      consumes:
      - application/json
      description: creential profile view
      parameters:
      - description: 'type: snmp / ssh / telnet / sftp / http'
        in: path
        name: credential_type
        required: true
        type: string
      - description: credential id (login/device profile id)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: record
          schema:
            type: string
      summary: Get credential record
      tags:
      - Credential
  /api/profile/http:
    post:
      consumes:
      - application/json
      description: help to save login profile or device profile creds
      parameters:
      - description: Request payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/M.AuthHTTP'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/M.AuthHTTP'
      summary: Save Login Credential
      tags:
      - Credential
  /api/profile/sftp:
    post:
      consumes:
      - application/json
      description: help to save login profile or device profile creds
      parameters:
      - description: Request payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/M.AuthSFTP'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/M.AuthSFTP'
      summary: Save Login Credential
      tags:
      - Credential
  /api/profile/snmp:
    post:
      consumes:
      - application/json
      description: help to save login profile or device profile creds
      parameters:
      - description: Request payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/M.AuthSNMP'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/M.AuthSNMP'
      summary: Save Login Credential
      tags:
      - Credential
  /api/profile/ssh:
    post:
      consumes:
      - application/json
      description: help to save login profile or device profile creds
      parameters:
      - description: Request payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/M.AuthSSH'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/M.AuthSSH'
      summary: Save Login Credential
      tags:
      - Credential
  /api/profile/telnet:
    post:
      consumes:
      - application/json
      description: help to save login profile or device profile creds
      parameters:
      - description: Request payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/M.AuthTELNET'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/M.AuthTELNET'
      summary: Save Login Credential
      tags:
      - Credential
swagger: "2.0"
