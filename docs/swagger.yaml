definitions:
  M.AuthHTTP:
    properties:
      credentialtype:
        type: string
      host:
        type: string
      login_profileid:
        type: string
      name:
        type: string
      no_of_custom_pairs:
        type: integer
      password:
        type: string
      port:
        type: string
      protocol_type:
        allOf:
        - $ref: '#/definitions/M.ProtocolType'
        enum:
        - http
        - https
      retries:
        type: integer
      timeout:
        type: integer
      type:
        type: string
      url:
        type: string
      username:
        type: string
    required:
    - login_profileid
    - name
    - protocol_type
    type: object
  M.AuthSFTP:
    properties:
      credentialtype:
        type: string
      login_profileid:
        type: string
      name:
        type: string
      password:
        type: string
      port:
        type: string
      protocol_type:
        allOf:
        - $ref: '#/definitions/M.ProtocolType'
        enum:
        - sftp
      retries:
        type: integer
      timeout:
        type: integer
      username:
        type: string
    required:
    - login_profileid
    - name
    - protocol_type
    type: object
  M.AuthSNMP:
    properties:
      auth_pass:
        type: string
      auth_type:
        type: string
      community:
        type: string
      context_engine_id:
        type: string
      context_name:
        type: string
      login_profileid:
        type: string
      max_oids:
        type: integer
      name:
        type: string
      port:
        type: integer
      priv_pass:
        type: string
      priv_type:
        type: string
      protocol_type:
        allOf:
        - $ref: '#/definitions/M.ProtocolType'
        enum:
        - snmp
      request_type:
        $ref: '#/definitions/M.SNMPOperation'
      retries:
        type: integer
      security_level:
        type: string
      timeout:
        type: integer
      username:
        type: string
      version:
        $ref: '#/definitions/M.SNMPVersion'
      wcommunity:
        type: string
    required:
    - login_profileid
    - name
    - protocol_type
    - version
    type: object
  M.AuthSSH:
    properties:
      credentialtype:
        type: string
      linked_profiles:
        items:
          $ref: '#/definitions/M.LinkedProfile'
        type: array
      login_profileid:
        type: string
      name:
        type: string
      password:
        type: string
      port:
        type: string
      protocol_type:
        allOf:
        - $ref: '#/definitions/M.ProtocolType'
        enum:
        - ssh
      retries:
        type: integer
      timeout:
        type: integer
      username:
        type: string
    required:
    - login_profileid
    - name
    - protocol_type
    type: object
  M.AuthTELNET:
    properties:
      credentialtype:
        type: string
      linked_profiles:
        items:
          $ref: '#/definitions/M.LinkedProfile'
        type: array
      login_profileid:
        type: string
      name:
        type: string
      password:
        type: string
      port:
        type: string
      protocol_type:
        allOf:
        - $ref: '#/definitions/M.ProtocolType'
        enum:
        - telnet
      retries:
        type: integer
      timeout:
        type: integer
      username:
        type: string
    required:
    - login_profileid
    - name
    - protocol_type
    type: object
  M.ICMPReq:
    properties:
      ci_id:
        type: string
      input_stats:
        items:
          $ref: '#/definitions/M.InputStat'
        type: array
      params:
        $ref: '#/definitions/M.PINGParams'
      poll_addr:
        type: string
    required:
    - ci_id
    - poll_addr
    type: object
  M.InputStat:
    properties:
      dn:
        type: string
      oid:
        type: string
    type: object
  M.LinkedProfile:
    properties:
      login_profileid:
        type: string
      protocol_type:
        $ref: '#/definitions/M.ProtocolType'
    required:
    - login_profileid
    - protocol_type
    type: object
  M.PINGParams:
    properties:
      mib_profile:
        type: string
      packsiz:
        type: integer
      parent_ci_id:
        type: string
      poll_addr:
        type: string
      poll_addr_list:
        items:
          type: string
        type: array
      poll_period:
        enum:
        - 5
        - 60
        - 300
        type: integer
      poll_type:
        enum:
        - ping
        type: string
    required:
    - poll_period
    - poll_type
    type: object
  M.ProtocolType:
    enum:
    - snmp
    - http
    - https
    - ssh
    - sftp
    - telnet
    type: string
    x-enum-varnames:
    - SNMPType
    - HTTPType
    - HTTPSType
    - SSHType
    - SFTPType
    - TELNETType
  M.SNMPOperation:
    enum:
    - 1
    - 2
    - 3
    type: integer
    x-enum-varnames:
    - GET
    - WALK
    - BULKWALK
  M.SNMPParams:
    properties:
      ci_category:
        type: string
      ci_name:
        type: string
      custom_type:
        description: OidIndex   string `json:"oidIndex"`
        type: string
      memory_size:
        type: integer
      mib_profile:
        type: string
      parent_ci_id:
        type: string
      poll_addr:
        type: string
      poll_addr_list:
        items:
          type: string
        type: array
      poll_period:
        enum:
        - 60
        - 300
        type: integer
      poll_type:
        enum:
        - snmp
        type: string
      speed:
        type: integer
    required:
    - poll_period
    - poll_type
    type: object
  M.SNMPReq:
    properties:
      ci_id:
        type: string
      input_stats:
        items:
          $ref: '#/definitions/M.InputStat'
        type: array
      login_profileid:
        type: string
      params:
        $ref: '#/definitions/M.SNMPParams'
      poll_addr:
        type: string
    required:
    - ci_id
    - login_profileid
    - poll_addr
    type: object
  M.SNMPVersion:
    enum:
    - "1"
    - 2c
    - "3"
    type: string
    x-enum-varnames:
    - VERSION1
    - VERSION2C
    - VERSION3
info:
  contact:
    email: pnkj3092@gmail.com
