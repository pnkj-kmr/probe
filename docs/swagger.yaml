paths:
  /:
    get:
      description: Responds with pong
      produces:
      - application/json
      responses:
        "200":
          description: pong
          schema:
            type: string
      summary: Ping
      tags:
      - Health
  /api/poll/icmp:
    post:
      consumes:
      - application/json
      description: APIs helps to write poll parameter into db
      parameters:
      - description: ICMP Request body
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/M.ICMPReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/M.ICMPReq'
      summary: Polling Status update
      tags:
      - Poll
  /api/poll/snmp:
    post:
      consumes:
      - application/json
      description: APIs helps to write poll parameter into db
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/M.SNMPReq'
      summary: Polling Status update
      tags:
      - Poll
swagger: "2.0"
