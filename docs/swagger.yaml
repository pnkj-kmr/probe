basePath: /api/
definitions:
  M.ICMPReq:
    properties:
      ci_id:
        type: string
      input_stats:
        items:
          $ref: '#/definitions/M.InputStat'
        type: array
      params:
        $ref: '#/definitions/M.PINGParams'
      poll_addr:
        type: string
    required:
    - ci_id
    - poll_addr
    type: object
  M.InputStat:
    properties:
      dn:
        type: string
      oid:
        type: string
    type: object
  M.PINGParams:
    properties:
      mib_profile:
        type: string
      packsiz:
        type: integer
      parent_ci_id:
        type: string
      poll_addr:
        type: string
      poll_addr_list:
        items:
          type: string
        type: array
      poll_period:
        enum:
        - 5
        - 60
        - 300
        type: integer
      poll_type:
        enum:
        - ping
        type: string
    required:
    - poll_period
    - poll_type
    type: object
  M.SNMPParams:
    properties:
      ci_category:
        type: string
      ci_name:
        type: string
      custom_type:
        description: OidIndex   string `json:"oidIndex"`
        type: string
      memory_size:
        type: integer
      mib_profile:
        type: string
      parent_ci_id:
        type: string
      poll_addr:
        type: string
      poll_addr_list:
        items:
          type: string
        type: array
      poll_period:
        enum:
        - 60
        - 300
        type: integer
      poll_type:
        enum:
        - snmp
        type: string
      speed:
        type: integer
    required:
    - poll_period
    - poll_type
    type: object
  M.SNMPReq:
    properties:
      ci_id:
        type: string
      input_stats:
        items:
          $ref: '#/definitions/M.InputStat'
        type: array
      login_profileid:
        type: string
      params:
        $ref: '#/definitions/M.SNMPParams'
      poll_addr:
        type: string
    required:
    - ci_id
    - login_profileid
    - poll_addr
    type: object
host: localhost:3000
info:
